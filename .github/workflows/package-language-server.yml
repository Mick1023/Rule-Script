name: Package Language Server

on:
  push:
    tags:
      - lsp-v*
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the language server tool to NuGet.org
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Pack language server tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate tag matches project version
        if: ${{ github.event_name == 'push' }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#lsp-v}"
          PROJECT_VERSION="$(dotnet msbuild RuleScript.LanguageServer/RuleScript.LanguageServer.csproj -getProperty:Version)"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match RuleScript.LanguageServer version $PROJECT_VERSION."
            exit 1
          fi

      - name: Restore
        run: dotnet restore RuleScript.sln

      - name: Build
        run: dotnet build RuleScript.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RuleScript.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack RuleScript.LanguageServer/RuleScript.LanguageServer.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rulescript-language-server-nuget
          path: artifacts/*.nupkg

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: package
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lsp-v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}

    steps:
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: rulescript-language-server-nuget
          path: artifacts

      - name: Validate NuGet API key
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is required to publish to NuGet.org."
            exit 1
          fi
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish package
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package
      - publish
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lsp-v') && needs.package.result == 'success' && needs.publish.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v8
        with:
          name: rulescript-language-server-nuget
          path: artifacts

      - name: Prepare release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${TAG}.md"

          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-notes.md
          else
            {
              echo "RuleScript Language Server ${TAG#lsp-}"
              echo
              echo "- Build passed"
              echo "- Tests passed"
              echo "- Tool package generated"
            } > release-notes.md
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: RuleScript Language Server ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-preview') }}
          # Keep the RuleScript.Core release marked as the latest release.
          make_latest: false
          overwrite_files: true
          files: artifacts/*.nupkg
